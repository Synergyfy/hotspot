<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Demo storefront scene">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="55%" stop-color="#efe6d6"/>
      <stop offset="100%" stop-color="#e2d3bd"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfd0b7"/>
      <stop offset="100%" stop-color="#cbb59a"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4f6f"/>
      <stop offset="100%" stop-color="#1f3a52"/>
    </linearGradient>
    <linearGradient id="cloth2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a4553f"/>
      <stop offset="100%" stop-color="#7d3d2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#5a4630" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- back wall panels -->
  <rect x="80" y="74" width="1040" height="580" rx="28" fill="#faf6ee"/>
  <rect x="80" y="74" width="1040" height="580" rx="28" fill="none" stroke="#e7dccb" stroke-width="2"/>

  <!-- arch niche -->
  <path d="M630 654V318c0-86 62-148 140-148s140 62 140 148v336z" fill="url(#arch)"/>
  <path d="M664 654V322c0-68 48-116 106-116s106 48 106 116v332z" fill="#f4ece0"/>

  <!-- shelf -->
  <rect x="902" y="520" width="168" height="12" rx="6" fill="#b99f80"/>
  <rect x="930" y="470" width="28" height="50" rx="8" fill="#7f9c85"/>
  <rect x="970" y="486" width="22" height="34" rx="7" fill="#d7a45a"/>
  <rect x="1004" y="462" width="30" height="58" rx="9" fill="#8a6f52"/>

  <!-- product rail / left pedestal -->
  <rect x="128" y="560" width="330" height="26" rx="13" fill="#c9b294"/>
  <rect x="146" y="586" width="18" height="70" rx="9" fill="#b79d7e"/>
  <rect x="422" y="586" width="18" height="70" rx="9" fill="#b79d7e"/>

  <!-- three folded garments -->
  <g filter="url(#soft)">
    <rect x="168" y="404" width="86" height="152" rx="14" fill="url(#cloth)"/>
    <path d="M180 430h62M180 462h62M180 494h62" stroke="#41637f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)">
    <rect x="274" y="424" width="86" height="132" rx="14" fill="url(#cloth2)"/>
    <path d="M286 450h62M286 482h62" stroke="#b76a52" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g filter="url(#soft)">
    <rect x="380" y="444" width="70" height="112" rx="14" fill="#5f7d63"/>
    <path d="M392 470h46M392 500h46" stroke="#7b9a7f" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- mannequin -->
  <g filter="url(#soft)">
    <ellipse cx="560" cy="598" rx="92" ry="14" fill="#c4ae92"/>
    <path d="M560 590c-34 0-58-24-58-58v-96c0-30 24-54 58-54s58 24 58 54v96c0 34-24 58-58 58z" fill="#f7f2e9"/>
    <path d="M512 442c14-22 34-34 48-34s34 12 48 34" fill="none" stroke="#e4dacb" stroke-width="6" stroke-linecap="round"/>
    <rect x="552" y="318" width="16" height="54" rx="8" fill="#cbb59a"/>
    <circle cx="560" cy="304" r="22" fill="#d9c3a6"/>
  </g>

  <!-- sign -->
  <g>
    <rect x="716" y="196" width="248" height="92" rx="18" fill="#1f2937"/>
    <text x="840" y="238" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#f9fafb" font-weight="700">NEW SEASON</text>
    <text x="840" y="264" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#9ca3af">CLICK THE DOTS TO EXPLORE</text>
  </g>

  <!-- plant -->
  <g>
    <rect x="1068" y="586" width="46" height="58" rx="10" fill="#b4885f"/>
    <path d="M1091 586c-30-26-34-62-14-92 22 18 28 54 14 92z" fill="#5f7d63"/>
    <path d="M1091 586c30-20 40-54 22-86-24 14-34 48-22 86z" fill="#76937a"/>
  </g>

  <!-- foreground floor line -->
  <path d="M80 654h1040" stroke="#e2d3bd" stroke-width="3"/>

  <!-- corner branding -->
  <text x="112" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#9a8b74">CLICKSIP DEMO SCENE</text>
</svg>
